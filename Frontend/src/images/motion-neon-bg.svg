<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- matte charcoal wall with a warm red cast -->
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241A1D"/>
      <stop offset="0.5" stop-color="#171113"/>
      <stop offset="1" stop-color="#0D0809"/>
    </linearGradient>

    <!-- glow cast on the wall behind the sign -->
    <radialGradient id="wallGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF1F3D" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#B30000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B30000" stop-opacity="0"/>
    </radialGradient>

    <!-- soft gloss sheen sweeping from the top left -->
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- darker corners keep the edges quiet -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <filter id="glowWide" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="glowTight" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- fine grain for the matte finish (shown by browsers) -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- single-line tube letters, each drawn in a 150 x 180 box -->
    <path id="M" d="M 12 172 L 12 10 L 75 112 L 138 10 L 138 172"/>
    <ellipse id="O" cx="75" cy="91" rx="63" ry="81"/>
    <path id="T" d="M 6 12 L 144 12 M 75 12 L 75 172"/>
    <path id="I" d="M 35 12 L 115 12 M 75 12 L 75 172 M 35 172 L 115 172"/>
    <path id="N" d="M 12 172 L 12 10 L 138 172 L 138 10"/>
    <path id="S" d="M 132 52 C 132 28 108 10 75 10 C 42 10 18 28 18 52 C 18 80 50 86 75 92 C 105 99 132 106 132 130 C 132 154 108 172 75 172 C 42 172 18 154 18 130"/>
    <path id="U" d="M 12 10 L 12 110 C 12 150 40 172 75 172 C 110 172 138 150 138 110 L 138 10"/>
    <path id="D" d="M 12 10 L 12 172 L 70 172 C 115 172 140 142 140 91 C 140 40 115 10 70 10 Z"/>

    <g id="sign" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- line 1: MOTION -->
      <g transform="translate(385 320)">
        <use href="#M"/>
        <use href="#O" x="200"/>
        <use href="#T" x="400"/>
        <use href="#I" x="600"/>
        <use href="#O" x="800"/>
        <use href="#N" x="1000"/>
      </g>
      <!-- line 2: STUDIO -->
      <g transform="translate(385 580)">
        <use href="#S"/>
        <use href="#T" x="200"/>
        <use href="#U" x="400"/>
        <use href="#D" x="600"/>
        <use href="#I" x="800"/>
        <use href="#O" x="1000"/>
      </g>
    </g>
  </defs>

  <!-- wall -->
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.07"/>
  <ellipse cx="960" cy="540" rx="900" ry="520" fill="url(#wallGlow)"/>

  <!-- gloss: a diagonal sheen across the left -->
  <path d="M 0 0 L 1150 0 L 520 1080 L 0 1080 Z" fill="url(#gloss)"/>
  <path d="M 1150 0 L 1160 0 L 530 1080 L 520 1080 Z" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- neon tubes: wide glow, tight glow, coloured tube, hot white core -->
  <use href="#sign" stroke="#FF1F3D" stroke-width="30" opacity="0.8" filter="url(#glowWide)"/>
  <use href="#sign" stroke="#FF2A44" stroke-width="20" opacity="0.9" filter="url(#glowTight)"/>
  <use href="#sign" stroke="#FF4B5C" stroke-width="13"/>
  <use href="#sign" stroke="#FFE6E8" stroke-width="4.5"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
